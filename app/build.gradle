plugins {
    id 'com.android.application'
}

android {
    namespace 'com.google.android.youtube.tv'
    compileSdk 35

    def releaseKeystorePath = System.getenv('SIGNING_KEYSTORE_PATH')
    def releaseKeystorePassword = System.getenv('SIGNING_KEYSTORE_PASSWORD')
    def releaseKeyAlias = System.getenv('SIGNING_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('SIGNING_KEY_PASSWORD')

    defaultConfig {
        minSdk 21
        targetSdk 35
        versionCode = (System.getenv('VERSION_CODE') ?: '1').toInteger()
        versionName = System.getenv('VERSION_NAME') ?: '1.0.0'
    }

    flavorDimensions = ['store']
    productFlavors {
        atv {
            dimension 'store'
            // Hijacks the Google TV / Android TV YouTube package identity.
            applicationId 'com.google.android.youtube.tv'
        }
        firetv {
            dimension 'store'
            // Hijacks the Fire OS YouTube package identity so Alexa's
            // "open YouTube" voice intents resolve to this bridge instead of
            // the uninstalled Amazon-catalog YouTube app.
            applicationId 'com.amazon.firetv.youtube'
        }
    }

    signingConfigs {
        if (releaseKeystorePath) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystorePath) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}
